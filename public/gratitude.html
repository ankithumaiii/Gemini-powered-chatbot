<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Jalebi Gratitude Jar - Collect moments of joy, gratitude, and small daily victories." />
  <title>Jalebi Gratitude Jar — Celebrate Small Wins</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #3b82f6;
      --blue-hover: #2563eb;
      --bg: #f4f7ff;
      --card: #ffffff;
      --border: #dbe4ff;
      --text: #1b2a49;
      --muted: #6c7a96;
      --shadow: 0 10px 30px rgba(31, 59, 114, .08);
    }

    body.dark {
      --bg: #0d1225;
      --card: #1b233a;
      --text: #e2e8f0;
      --border: #273147;
      --muted: #9aa3b2;
      --shadow: 0 10px 30px rgba(0, 0, 0, .25);
    }

    * { box-sizing: border-box; }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      margin: 0;
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
      transition: background .3s, color .3s;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 16px 22px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 26px);
      color: var(--blue);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    a.back {
      text-decoration: none;
      color: var(--blue);
      font-weight: 600;
      font-size: 14.5px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(59, 130, 246, 0.08);
      transition: background .2s ease;
      white-space: nowrap;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
    }

    a.back:hover {
      background: rgba(59, 130, 246, 0.16);
    }

    .inputBox {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      align-items: center;
    }

    input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 16px; /* 16px prevents iOS Safari auto-zoom */
      font-family: inherit;
      outline: none;
      min-height: 48px;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    button#gSave {
      padding: 13px 24px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      min-height: 48px;
      white-space: nowrap;
      transition: background .2s ease, transform .1s ease;
      touch-action: manipulation;
    }

    button#gSave:hover {
      background: var(--blue-hover);
    }

    button#gSave:active {
      transform: scale(0.98);
    }

    .thanks {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .notes-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: -4px;
    }

    .note {
      background: var(--card);
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeIn .25s ease;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .time {
      color: var(--muted);
      font-size: 12.5px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .note-text {
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-style: italic;
      background: var(--card);
      border-radius: 16px;
      border: 1px dashed var(--border);
    }

    /* RESPONSIVE BREAKPOINTS */
    @media (max-width: 640px) {
      body {
        padding: 16px 14px;
      }

      header {
        padding: 14px 16px;
      }

      .inputBox {
        flex-direction: column;
        gap: 10px;
      }

      input {
        width: 100%;
      }

      button#gSave {
        width: 100%;
      }

      .note {
        padding: 16px 16px;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 12px 10px;
      }

      header {
        padding: 12px 12px;
      }

      h1 {
        font-size: 18px;
      }

      a.back {
        padding: 6px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">
  <header role="banner">
    <h1>🌟 Gratitude Jar</h1>
    <a href="./index.html" class="back" aria-label="Back to home page">← Back to Home</a>
  </header>

  <main class="input-section">
    <div class="inputBox">
      <input id="gInput" placeholder="What made you smile today?" aria-label="Gratitude note input" autocomplete="off" />
      <button id="gSave" type="button">Add to Jar</button>
    </div>
  </main>

  <section class="notes-section" aria-label="Gratitude Jar Notes">
    <div id="gList" class="thanks"></div>
  </section>
</div>

<script>
  // Sync dark theme if set by chatbot
  if (localStorage.getItem("jalebi_theme") === "dark") {
    document.body.classList.add("dark");
  }

  const key = "jalebi_gratitude_v1";
  let jar = [];
  try {
    jar = JSON.parse(localStorage.getItem(key) || "[]");
  } catch (e) {
    console.warn("Could not read gratitude jar from localStorage", e);
    jar = [];
  }

  const list = document.getElementById("gList");

  function render() {
    list.innerHTML = "";

    if (jar.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Your gratitude jar is waiting for its first spark of joy ✨";
      list.appendChild(empty);
      return;
    }

    const heading = document.createElement("div");
    heading.className = "notes-title";
    heading.textContent = `Gratitude Moments (${jar.length})`;
    list.appendChild(heading);

    jar.forEach(e => {
      const div = document.createElement("div");
      div.className = "note";

      const timeDiv = document.createElement("div");
      timeDiv.className = "time";
      const dateObj = new Date(e.time);
      timeDiv.textContent = isNaN(dateObj) ? "Earlier" : dateObj.toLocaleString();

      const textDiv = document.createElement("div");
      textDiv.className = "note-text";
      textDiv.textContent = e.text; // Safe from XSS: sets pure text content

      div.appendChild(timeDiv);
      div.appendChild(textDiv);
      list.appendChild(div);
    });
  }

  render();

  function addNote() {
    const inputElem = document.getElementById("gInput");
    const t = inputElem.value.trim();
    if (!t) return;

    jar.unshift({ text: t, time: Date.now() });

    try {
      localStorage.setItem(key, JSON.stringify(jar));
    } catch (e) {
      console.warn("Could not save gratitude note to localStorage", e);
    }

    inputElem.value = "";
    render();
  }

  document.getElementById("gSave").onclick = addNote;
  document.getElementById("gInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      addNote();
    }
  });
</script>

</body>
</html>
